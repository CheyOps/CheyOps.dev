<!--co-authored-by claude -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>x-dc{display:none}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0a0c10}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes caretblink{0%,48%{opacity:1}49%,100%{opacity:0}}
  ::selection{background:rgba(183,148,255,0.32);color:#fff}
</style>
</helmet>
<div style="position:relative;font-family:'Space Grotesk',system-ui,sans-serif;background:#0a0c10;color:#E9EAEE;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:32px;">
  <canvas id="cvCard" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,transparent 30%,rgba(10,12,16,0.7) 100%);pointer-events:none;"></div>

  <div style="position:relative;z-index:3;text-align:center;max-width:700px;animation:fadeUp .9s ease both;">
    <div style="display:inline-flex;align-items:center;font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(48px,13vw,100px);letter-spacing:-0.5px;line-height:1;white-space:nowrap;margin-bottom:30px;">
      <span style="font-weight:700;color:#F4F4F7;">Chey</span>
      <span style="display:inline-block;width:0.06em;height:0.74em;margin:0 0.1em;border-radius:2px;background:#B794FF;box-shadow:0 0 12px rgba(183,148,250,0.85);animation:caretblink 1.05s steps(1) infinite;"></span>
      <span style="font-weight:600;color:#B794FF;text-shadow:0 0 24px rgba(183,148,250,0.35);">Ops</span>
    </div>
    <h1 style="font-size:clamp(28px,6.5vw,40px);font-weight:600;line-height:1.1;letter-spacing:clamp(-1px,-0.3vw,-2px);margin:0 0 22px;color:#F4F4F7;">Security First Engineering</h1>
<p style="font-size:clamp(17px,2.6vw,25px);line-height:2;color:#aeb2bd;margin:0 auto 44px;max-width:600px;">Development · Security ·  AI · Systems · Automation</p>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
      <div id="ghBtn" role="button" tabindex="0" style="display:inline-flex;align-items:center;gap:11px;cursor:pointer;background:#111521;border:1px solid rgba(255,255,255,0.1);border-radius:13px;padding:14px 22px;transition:border-color .3s,background .3s,transform .2s;" style-hover="border-color:rgba(183,148,255,0.5);background:rgba(183,148,255,0.06);transform:translateY(-1px);">
        <span style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,0.06);font-family:'JetBrains Mono',monospace;font-size:14px;color:#E9EAEE;">GH</span>
        <span style="font-size:15.5px;font-weight:600;color:#F4F4F7;">GitHub</span>
        <span style="color:#B794FF;font-size:14px;">↗</span>
      </div>
      <div id="liBtn" role="button" tabindex="0" style="display:none;align-items:center;gap:11px;cursor:pointer;background:#111521;border:1px solid rgba(255,255,255,0.1);border-radius:13px;padding:14px 22px;transition:border-color .3s,background .3s,transform .2s;" style-hover="border-color:rgba(183,148,255,0.5);background:rgba(183,148,255,0.06);transform:translateY(-1px);">
        <span style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,0.06);font-family:'JetBrains Mono',monospace;font-size:14px;color:#E9EAEE;">in</span>
        <span style="font-size:15.5px;font-weight:600;color:#F4F4F7;">LinkedIn</span>
        <span style="color:#B794FF;font-size:14px;">↗</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script id="dcLogic"></script>
<script>
  // DC runtime compiles the component logic from #dcLogic's text content, so we
  // load js/card.js into it first, then boot support.js once the logic is in place.
  fetch('./js/card.js')
    .then((r) => r.text())
    .then((src) => {
      document.getElementById('dcLogic').textContent = src;
      const s = document.createElement('script');
      s.src = './js/support.js';
      document.body.appendChild(s);
    })
    .catch((err) => console.error('[dc] failed to load card logic:', err));
</script>
</body>
</html>
